# config.libya.yaml
# Single override file for a SMALL, FAST first test run of PyPSA-Earth on Libya.
# Usage:
#   snakemake --configfile config.libya.yaml --cores all solve_elec_networks
# (Only one configfile needed — config.default.yaml is loaded automatically
# by the Snakefile; this file overrides it.)

run:
  name: "libya-test"

countries: ["LY"]

# --- Keep this ONE day, matches config.default.yaml's snapshots block ---
snapshots:
  start: "2013-01-01"
  end: "2013-01-02"
  inclusive: "left"

# =================== DATA RETRIEVAL (the actual fix) ===================
enable:
  retrieve_databundle: true
  download_osm_data: true
  retrieve_cost_data: true
  retrieve_cutout: false      # <-- was true: was downloading the full bundled cutout
  build_cutout: true          # <-- builds a small custom cutout from YOUR bbox+time below
  build_natura_raster: false
  retrieve_databundle_sector: false   # not needed for an electricity-only model
  download_global_buildings: false

# =================== SMALL CUTOUT ===================
atlite:
  nprocesses: 2
  default: cutout-2013-era5    # <-- reuse the SAME name as config.default.yaml, no mismatch
  cutouts:
    cutout-2013-era5:
      module: era5
      dx: 0.3
      dy: 0.3
      # Rough Libya bounding box — tighten further once you check results
      x: [9.0, 26.0]
      y: [19.0, 34.0]
      # time is left unset here on purpose: build_cutout uses the top-level
      # `snapshots:` block above automatically (one day, 2013-01-01)

# =================== ELECTRICITY-ONLY, SMALL CLUSTERING ===================
electricity:
  extendable_carriers:
    Generator: [solar, onwind, OCGT, CCGT]
    StorageUnit: [battery]
    Store: [H2]
  conventional_carriers: [OCGT, CCGT, oil]
  renewable_carriers: [solar, onwind]
  co2limit: null   # no Libyan decarbonisation target yet — treat as a scenario
                    # assumption, state this explicitly in any write-up

clustering:
  n_clusters: [8]   # ONE small value for a first test, not a sweep — a sweep
                     # of [1,4,8,...,40] solves the network once PER value,
                     # multiplying runtime and memory use accordingly

costs:
  year: 2030

solving:
  solver:
    name: highs
    options: highs-default
  mem: 4000   # MB — lower than the 30000 default, fine for a 1-day/4-node test
