# config_hybrid_abc_emis_pr_100.yaml
#
# HYBRID SCENARIO: based directly on Scenario C (all three H2 production
# technologies are choosable: H2 Electrolysis, SMR, SMR CC), with two
# changes on top of the original Scenario C file:
#
#   1) CO2 pricing turned ON instead of a hard cap: co2.limit -> .inf
#      (non-binding) and co2.emission_price -> 100 EUR/tCO2. This requires
#      the add_emission_price_sector() patch already applied to
#      prepare_sector_network.py (prices SMR + SMR CC's vented CO2 via
#      their "co2 atmosphere" bus), plus the Ep wildcard so the
#      electricity-only stage (OCGT/CCGT/oil) is priced consistently too.
#
#   2) policy_config.hydrogen.temporal_matching -> "year" (kept from
#      Scenario A, per explicit instruction), overriding Scenario C's
#      original "no_temporal_matching". Exported H2 must be backed by an
#      equivalent amount of renewable generation somewhere in the system
#      over the course of the year.
#
# Everything else below is Scenario C's config, UNCHANGED.

run:
  name: "libya_h2export_hybrid_emispr_100"   # <-- CHANGED: distinct
                                        # run name so this doesn't collide
                                        # with scenario a/b/c or the earlier
                                        # emis_price_100 test run

countries: ["LY"]

scenario:
  clusters: [12]
  opts: [Co2L-Ep-3h]   # <-- CHANGED: Ep added so the price is applied
                        #     economy-wide (electricity-only stage +
                        #     sector-coupled SMR/SMR CC via the patch)
  planning_horizons: [2030]
  sopts: [""]
  demand: ["AB"]

snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: "left"

enable:
  retrieve_databundle: true
  download_osm_data: true
  retrieve_cost_data: true
  retrieve_cutout: false
  build_cutout: false
  build_natura_raster: false
  retrieve_databundle_sector: true
  download_global_buildings: false

atlite:
  nprocesses: 2
  default: cutout-2013-era5
  cutouts:
    cutout-2013-era5:
      module: era5
      dx: 0.3
      dy: 0.3
      x: [9.0, 26.0]
      y: [19.0, 34.0]

electricity:
  offshore: false
  extendable_carriers:
    Generator: [solar, onwind, OCGT, CCGT, oil]
    StorageUnit: [battery]
    Store: [H2]
    Link: [H2 Electrolysis, H2 Fuel Cell]
  conventional_carriers: [OCGT, CCGT, oil]
  renewable_carriers: [solar, onwind]

sector:
  enable:
    heat: false
    biomass: false
    industry: true
    hydrogen: true
    shipping: false
    aviation: false
    land_transport: false
    rail_transport: false
    agriculture: false
    residential: false
    services: false

  hydrogen:
    network: true
    h2_turbine: true
    network_limit: 2000
    network_routes: greenfield
    gas_network_repurposing: false
    underground_storage:
      enabled: true

    # =========== FROM SCENARIO C (unchanged) ===========
    production_technologies:   # <-- all three technologies remain choosable;
      - H2 Electrolysis         #     the model now selects the cost-optimal
      - SMR                     #     mix under a real EUR100/tCO2 price
      - SMR CC                  #     signal instead of an artificial
    # per-scenario technology restriction.

industry:
  h2_fuel_cell: true
  h2_electrolysis: true

export:
  h2export: [0]  # [70]
  endogenous: false
  store: "H2"
  store_capital_costs: "standard_costs"
  export_profile: "ship"
  ship:
    ship_capacity: 0.4
    travel_time: 288
    fill_time: 24
    unload_time: 24

# =========== CHANGED: temporal_matching kept as "year" per instruction ===========
policy_config:
  hydrogen:
    temporal_matching: "year"   # <-- CHANGED from Scenario C's
      # "no_temporal_matching" to "year" (Scenario A's setting), kept as
      # explicitly requested: exported H2 must be backed by an equivalent
      # amount of renewable generation somewhere in the system over the
      # course of a year.
    spatial_matching: false
    additionality: false

clustering:
  distribute_cluster: ["load"]
  focus_weights:
    LY: 1.0
  simplify_network:
    to_substations: false
    remove_stubs: true
    remove_stubs_across_borders: false
    p_threshold_drop_isolated: 0.0
    p_threshold_merge_isolated: 0.05
    s_threshold_fetch_isolated: false
  cluster_network:
    algorithm: kmeans
    feature: load

osm:
  build_osm_network:
    group_close_buses: true
    group_tolerance_buses: 15000

augmented_line_connection:
  add_to_snakefile: true
  connectivity_upgrade: 1
  new_line_type: ["HVAC"]
  min_expansion: 1

# =========== CHANGED: price instead of hard cap ===========
co2:
  limit: .inf        # <-- CHANGED from Scenario C's 1.0e12: fully
                      #     non-binding, so the EUR/tCO2 price is the only
                      #     lever shaping the technology mix (no cap
                      #     interference)
  emission_price: 100 # <-- CHANGED: EUR/tCO2, requires the
                      #     add_emission_price_sector() patch in
                      #     prepare_sector_network.py

costs:
  year: 2030

solving:
  options:
    formulation: linopy
    clip_p_max_pu: 0.01
  solver:
    name: highs
    options: highs-default
  solver_options:
    highs-default:
      threads: 12
      parallel: "on"
      solver: "ipm"
      run_crossover: "off"
      user_bound_scale: -14
      primal_feasibility_tolerance: 1e-3
      dual_feasibility_tolerance: 1e-3
      ipm_optimality_tolerance: 1e-3
  mem: 16000

