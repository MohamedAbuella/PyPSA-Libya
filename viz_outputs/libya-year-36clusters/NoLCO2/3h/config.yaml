# config.yaml
# PyPSA-Earth configuration for Libya with enforced renewable capacity limits

run:
  name: "libya-year-36_NoLCO2_3h"

countries: ["LY"]

scenario:
  clusters: [36]
  opts: [Co2L-3h] # [Co2L-6h]



snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: "left"

enable:
  retrieve_databundle: true
  download_osm_data: true
  retrieve_cost_data: true
  retrieve_cutout: false
  build_cutout: false
  build_natura_raster: false
  retrieve_databundle_sector: false
  download_global_buildings: false

atlite:
  nprocesses: 2
  default: cutout-2013-era5
  cutouts:
    cutout-2013-era5:
      module: era5
      dx: 0.3
      dy: 0.3
      x: [9.0, 26.0]
      y: [19.0, 34.0]


electricity:
  offshore: false
  extendable_carriers:
    Generator: [solar, onwind, OCGT, CCGT, oil] #[OCGT, CCGT, oil]
    StorageUnit: [battery, H2] #[]
    Store: [] #[battery, H2] #[battery, H2]
    Link: [] #[battery charger, battery discharger, H2 Electrolysis, H2 Fuel Cell]
  conventional_carriers: [OCGT, CCGT, oil]
  renewable_carriers: [solar, onwind]


clustering:
  distribute_cluster: ["load"]
  focus_weights:
    LY: 1.0


  simplify_network:
    to_substations: false
    remove_stubs: true
    remove_stubs_across_borders: false
    p_threshold_drop_isolated: 0.0
    p_threshold_merge_isolated: 0.05
    s_threshold_fetch_isolated: false 


  cluster_network:
    algorithm: kmeans
    feature: load #solar+onwind


osm:
  build_osm_network:
    group_close_buses: true
    group_tolerance_buses: 15000  # Increase snapping distance from 5000m to 170000m


augmented_line_connection:
  add_to_snakefile: true
  connectivity_upgrade: 1 # Guarantees every node has at least 1 line connection
  new_line_type: ["HVAC"]
  min_expansion: 1


co2:
  limit: 1.0e9    # 1.0e9 still a non-binding placeholder — no real Libyan CO2
                  # target defined yet


costs:
  year: 2030


solving:
  solver:
    name: highs
    options: highs-default
  solver_options:
    highs-default:
      threads: 8  # Adjust based on your available CPU cores (e.g., 4 to 16)
      solver: "ipm"
      run_crossover: "off"
      primal_feasibility_tolerance: 1e-3
      dual_feasibility_tolerance: 1e-3
      ipm_optimality_tolerance: 1e-3
  mem: 12000


